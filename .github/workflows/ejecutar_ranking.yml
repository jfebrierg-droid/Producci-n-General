name: Ejecutar Ranking MEGAPODEROSOS

on:
  schedule:
    # Ejecuta automáticamente todos los días a las 12:00 UTC (8:00 AM hora Santo Domingo)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar procesamiento y envío de correo
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          URL_IMAGEN: ${{ secrets.URL_IMAGEN }}
        run: python procesar_ranking.py
