name: Ejecutar Ranking MEGAPODEROSOS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar reporte_diario.png desde Google Drive
        run: |
          curl -L "https://drive.google.com/uc?export=download&id=1Nzq9YFjRqQgQqjjkZqqZ7abm0cm0zzf5" -o reporte_diario.png

      - name: Ejecutar procesamiento y envio de correo
        run: python procesar_ranking.py
